name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch: {}


permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest

    steps:
      - name: 检出 Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: 确认 Release 来自主分支
        if: github.event.release.tag_name != ''
        run: git merge-base --is-ancestor HEAD origin/main

      - name: 确认手动触发来自主分支
        if: github.event.release.tag_name == ''
        run: test "$(git branch -r --contains HEAD | grep -cE 'origin/(main|HEAD)$')" = 1

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 校验版本
        if: github.event.release.tag_name != ''
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"

      - name: 安装依赖
        run: npm install --no-save

      - name: 检查语法
        run: |
          node --check src/index.js
          node --check src/client.js

      - name: 测试及发布包校验
        run: |
          npm test
          npm run smoke
          npm run test:host

      - name: 发布到 npm
        run: npm publish
